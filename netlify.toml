# Let browsers cache images for a week so repeat visits load faster.
# If you replace an image but keep the same file name, visitors may see
# the old one for up to 7 days. Give the new image a new name to avoid that.
[[headers]]
  for = "/images/*"
  [headers.values]
    Cache-Control = "public, max-age=604800"

# The Starter Guide is a free download behind the blog sign-up form.
# Keep the PDF itself out of Google so people find it through the form.
[[headers]]
  for = "/downloads/*"
  [headers.values]
    X-Robots-Tag = "noindex"

# Short, easy-to-type link for social posts: fuelwithjess.com/macros
# jumps straight to the Starter Guide sign-up box on the macros blog post.
# 302 (temporary) so the destination can be changed later without browsers
# remembering the old one.
[[redirects]]
  from = "/macros"
  to = "/blog/how-to-count-macros-beginners#starter-guide"
  status = 302
